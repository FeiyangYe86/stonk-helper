[project]
name = "stonk-helper"
version = "0.1.0"
description = "Personal multi-agent trading system for US equities via IBKR"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pydantic>=2.6",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
broker = [
    "ib-async>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stonk_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
